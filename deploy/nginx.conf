# /etc/nginx/sites-available/dhanvesttor.com  (Hostinger VPS)
# The Next.js site on dhanvesttor.com; WordPress (headless CMS) on cms.dhanvesttor.com.
server {
  listen 80;
  server_name dhanvesttor.com www.dhanvesttor.com;
  return 301 https://dhanvesttor.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.dhanvesttor.com;
  ssl_certificate     /etc/letsencrypt/live/dhanvesttor.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dhanvesttor.com/privkey.pem;
  return 301 https://dhanvesttor.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name dhanvesttor.com;
  ssl_certificate     /etc/letsencrypt/live/dhanvesttor.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dhanvesttor.com/privkey.pem;

  client_max_body_size 8m;   # CV uploads are capped at 5 MB in the app
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  # Old WordPress URLs -> new site
  location = /about-us/        { return 301 /about; }
  location = /services/        { return 301 /pms; }
  location = /contact-us/      { return 301 /contact; }
  location = /blog/            { return 301 /insights; }
  location = /careers/         { return 301 /careers; }
  location = /privacy-policy/  { return 301 /regulatory/privacy; }
  location = /disclaimer/      { return 301 /regulatory/disclaimer; }
  location = /regulatory-information/ { return 301 /regulatory; }
  location = /accessibility-statement/ { return 301 /regulatory/accessibility; }
  location = /mutual-funds-vs-portfolio-management-services-whats-right-for-you/ { return 301 /insights/pms-vs-mutual-funds-honest-comparison; }
  location = /understanding-the-phases-of-a-bear-market-a-complete-breakdown/ { return 301 /insights/what-a-bear-market-feels-like; }

  location /_next/static/ {
    alias /var/www/dhanvesttor/current/.next/static/;
    expires 1y; add_header Cache-Control "public, immutable";
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
